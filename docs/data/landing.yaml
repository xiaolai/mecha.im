hero:
  enable: true
  weight: 10
  template: hero

  badge:
    text: v0.1.0
    color: primary
    pill: false
    soft: true

  title: "Mecha"
  subtitle: An event-driven server that **dispatches tasks** to **LLM workers** and writes **results back** to GitHub.

  image:
    path: "images"
    filename: "mecha-512.png"
    alt: "Mecha Logo"
    boxShadow: false
    rounded: false

  ctaButton:
    icon: rocket_launch
    btnText: "Get Started"
    url: "/docs/getting-started/"
  cta2Button:
    icon: code
    btnText: "View on GitHub"
    url: "https://github.com/xiaolai/mecha.im"

  info: "**Open Source** MIT Licensed."

featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: How it works
  subtitle: Four nouns. One pipeline. That's the whole system.

  items:
    - title: Event
      icon: bolt
      description: Something happened — a GitHub webhook, a schedule trigger, an API call. Events are the input to the system.

    - title: Worker
      icon: smart_toy
      description: Any LLM that takes a prompt and returns a result. Claude, Codex, Gemini, Ollama — or any HTTP endpoint on your network.

    - title: Task
      icon: task_alt
      description: An event matched to a worker. The only moving object. One lifecycle — received, dispatched, completed, or failed.

    - title: Policy
      icon: shield
      description: What a result is allowed to contain. The guardrail between the worker and the outside world. All writes go through Policy.

    - title: Your Infrastructure
      icon: dns
      description: Docker containers, Tailscale services, or GitHub runners. Three provisioning strategies. Same result contract.

    - title: Security First
      icon: lock
      description: Workers never see GitHub tokens. All writes go through mecha. One security boundary. One audit trail.

imageCompare:
  enable: false
