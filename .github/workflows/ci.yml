name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.1
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go test -race ./...
      - run: go build -o /dev/null ./cmd/mecha
      - run: go build -o /dev/null ./cmd/mecha-mcp
      - run: make cover-check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Runtime unit tests (TypeScript)
        working-directory: docker/runtime
        run: bun test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - name: Build worker images
        run: make image
      - name: Docker integration tests
        run: go test -v -race -run "TestDocker|TestRuntime" -timeout 15m ./test/integration/...
