name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go test -race ./...
      - run: go build -o /dev/null ./cmd/mecha
      - run: go build -o /dev/null ./cmd/mecha-mcp
      - run: make cover-check

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - name: Build worker images
        run: make image
      - name: Docker integration tests
        run: go test -v -race -run "TestDocker|TestRuntime" -timeout 15m ./test/integration/...
