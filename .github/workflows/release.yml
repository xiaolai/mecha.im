name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + sign, no release)"
        type: boolean
        default: true

env:
  GO_VERSION: "1.26.1"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build linux-amd64
        run: |
          mkdir -p dist/linux-amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X mecha.im/internal/cli.Version=${GITHUB_REF_NAME:-dev}" -o dist/linux-amd64/mecha ./cmd/mecha

      - name: Build linux-arm64
        run: |
          mkdir -p dist/linux-arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X mecha.im/internal/cli.Version=${GITHUB_REF_NAME:-dev}" -o dist/linux-arm64/mecha ./cmd/mecha

      - uses: actions/upload-artifact@v4
        with:
          name: mecha-linux-amd64
          path: dist/linux-amd64/

      - uses: actions/upload-artifact@v4
        with:
          name: mecha-linux-arm64
          path: dist/linux-arm64/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build darwin-arm64
        run: |
          mkdir -p dist/darwin-arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X mecha.im/internal/cli.Version=${GITHUB_REF_NAME:-dev}" -o dist/darwin-arm64/mecha ./cmd/mecha

      - name: Build darwin-amd64
        run: |
          mkdir -p dist/darwin-amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X mecha.im/internal/cli.Version=${GITHUB_REF_NAME:-dev}" -o dist/darwin-amd64/mecha ./cmd/mecha

      - name: Install Apple certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        if: env.CERTIFICATE_BASE64 != ''
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Sign binaries
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        if: env.APPLE_TEAM_ID != ''
        run: |
          for bin in dist/darwin-arm64/mecha dist/darwin-amd64/mecha; do
            codesign --sign "Developer ID Application: HANDO K.K. ($APPLE_TEAM_ID)" \
              --options runtime --timestamp --force "$bin"
            codesign --verify --verbose "$bin"
          done

      - name: Notarize binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        if: env.APPLE_TEAM_ID != ''
        run: |
          for arch in darwin-arm64 darwin-amd64; do
            ditto -c -k --keepParent "dist/$arch/mecha" "/tmp/mecha-$arch.zip"
            xcrun notarytool submit "/tmp/mecha-$arch.zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --wait
          done

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: mecha-darwin-arm64
          path: dist/darwin-arm64/

      - uses: actions/upload-artifact@v4
        with:
          name: mecha-darwin-amd64
          path: dist/darwin-amd64/

  release:
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package archives
        run: |
          cd artifacts
          for dir in mecha-*/; do
            name="${dir%/}"
            tar -czf "${name}.tar.gz" -C "$dir" .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/mecha-*.tar.gz

  update-homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256 hashes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            URL="https://github.com/xiaolai/mecha.im/releases/download/${TAG}/mecha-${platform}.tar.gz"
            SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')
            VAR="SHA_$(echo "$platform" | tr '-' '_' | tr '[:lower:]' '[:upper:]')"
            echo "${VAR}=${SHA}" >> "$GITHUB_ENV"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: xiaolai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cat > homebrew-tap/Formula/mecha.rb << RUBY
          class Mecha < Formula
            desc "Agentic workflow engine for LLM tasks"
            homepage "https://mecha.im"
            version "$VERSION"
            license "ISC"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/xiaolai/mecha.im/releases/download/v#{version}/mecha-darwin-arm64.tar.gz"
                sha256 "$SHA_DARWIN_ARM64"
              else
                url "https://github.com/xiaolai/mecha.im/releases/download/v#{version}/mecha-darwin-amd64.tar.gz"
                sha256 "$SHA_DARWIN_AMD64"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/xiaolai/mecha.im/releases/download/v#{version}/mecha-linux-arm64.tar.gz"
                sha256 "$SHA_LINUX_ARM64"
              else
                url "https://github.com/xiaolai/mecha.im/releases/download/v#{version}/mecha-linux-amd64.tar.gz"
                sha256 "$SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "mecha"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mecha version")
            end
          end
          RUBY

      - name: Push formula update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mecha.rb
          git commit -m "mecha $VERSION"
          git push
