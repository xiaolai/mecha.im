name: claude-sandbox
docker:
  image: ghcr.io/xiaolai/mecha-worker-claude:v1.0.0
  host: unix:///var/run/docker.sock
  resources:
    cpu: 4
    memory: 8G
    pids: 256
  lifecycle: disposable
  port: 8080
  proxy:
    target: https://api.anthropic.com
    key: ${CLAUDE_CODE_OAUTH_TOKEN}
  egress: [api.anthropic.com]
timeout: 10m
